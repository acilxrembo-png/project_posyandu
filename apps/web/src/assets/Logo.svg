<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradien Latar Belakang Rumah -->
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />   <!-- Cyan Cerah -->
      <stop offset="50%" stop-color="#0284C7" />  <!-- Biru Medis -->
      <stop offset="100%" stop-color="#1E3A8A" /> <!-- Biru Gelap / Elegan -->
    </linearGradient>

    <!-- Gradien 3D untuk Karakter Ayah -->
    <linearGradient id="fatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Gradien 3D untuk Karakter Ibu -->
    <linearGradient id="motherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Gradien 3D untuk Karakter Bayi -->
    <linearGradient id="babyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Efek Pantulan Kaca (Glassmorphism) -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Efek Bayangan Realistis -->
    <filter id="mainShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>

    <!-- Pemotong (Clip Path) agar keluarga tidak keluar dari batas rumah -->
    <clipPath id="houseClip">
      <path d="M 256 50 L 460 230 L 420 230 A 164 164 0 0 1 92 230 L 52 230 Z" />
    </clipPath>
  </defs>

  <!-- 1. BENTUK RUMAH UTAMA (Background) -->
  <path d="M 256 50 L 460 230 L 420 230 A 164 164 0 0 1 92 230 L 52 230 Z"
        fill="url(#houseGrad)"
        stroke="url(#houseGrad)"
        stroke-width="16"
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#mainShadow)"/>

  <!-- Garis Tepi Rumah (Bevel/Cahaya 3D) -->
  <path d="M 256 50 L 460 230 L 420 230 A 164 164 0 0 1 92 230 L 52 230 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.4"
        stroke-width="3"
        stroke-linejoin="round"
        stroke-linecap="round" />

  <!-- 2. KELUARGA (Dipotong mengikuti bentuk rumah) -->
  <g clip-path="url(#houseClip)">

     <!-- A. AYAH (Posisi Belakang, Kiri) -->
     <g>
       <circle cx="180" cy="200" r="40" fill="url(#fatherGrad)"/>
       <path d="M 80 420 C 80 270, 140 245, 180 250 C 240 255, 270 310, 280 420 Z" fill="url(#fatherGrad)"/>
     </g>

     <!-- B. IBU (Posisi Tengah, Kanan) - Dengan Bayangan 3D -->
     <g filter="url(#dropShadow)">
       <circle cx="300" cy="240" r="36" fill="url(#motherGrad)" stroke="#FFFFFF" stroke-width="2" />
       <path d="M 420 420 C 420 310, 360 280, 300 285 C 250 290, 220 350, 210 420 Z" fill="url(#motherGrad)" stroke="#FFFFFF" stroke-width="2" />
     </g>

     <!-- C. ANAK/BAYI (Posisi Depan, Bawah Kanan) - Dengan Bayangan 3D -->
     <g filter="url(#dropShadow)">
       <circle cx="340" cy="310" r="24" fill="url(#babyGrad)" stroke="#FFFFFF" stroke-width="2" />
       <path d="M 410 420 C 410 350, 370 340, 340 345 C 310 350, 290 380, 280 420 Z" fill="url(#babyGrad)" stroke="#FFFFFF" stroke-width="2" />
     </g>

     <!-- 3. EFEK KACA BERSINAR DI ATAS KELUARGA -->
     <path d="M 256 50 L 460 230 L 52 230 Z" fill="url(#glassGrad)"/>
  </g>
</svg>
